name: build-and-release

on:
  push:
    branches: [main]
    tags: ['*']

jobs:
  build:
    name: Build and create a release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code # https://github.com/actions/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-tags: true

      - name: Install node # https://github.com/actions/setup-node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci --ignore-scripts --allow-git=none --allow-remote=none

      - name: Test project
        run: npm run test

      - name: Set TAG variables
        id: tags_variables
        run: |
          set -x

          TAG_CURRENT=$(git describe --abbrev=0 --tags ${{ github.ref }})
          echo "TAG_CURRENT=$TAG_CURRENT" >> "$GITHUB_ENV"

          echo "CHANGELOG_MESSAGE<<EOF" >> $GITHUB_ENV
          sed -n "/## $LAST_TAG/,/##/p" CHANGELOG.md | grep -v "^##" | grep . >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release # https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_CURRENT }}
          body: |
            ${{ env.CHANGELOG_MESSAGE }}

            Realease available at:

            - https://www.npmjs.com/package/@timshel_npm/maildev/v/${{ env.TAG_CURRENT }}
            - https://hub.docker.com/layers/timshel/maildev/${{ env.TAG_CURRENT }}

            :robot: Built by [release.yml](.github/workflows/release.yml) :robot:
          draft: false
          prerelease: false

  docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    needs: build
    steps:
      - name: Checkout code # https://github.com/actions/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to Docker Hub # https://github.com/docker/login-action
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker # https://github.com/docker/metadata-action
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: timshel/maildev

      - name: Build and push Docker image # https://github.com/docker/build-push-action
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: push
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npmjs:
    name: Release to Npm JS
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      contents: read
      id-token: write
    needs: build
    steps:
      - name: Checkout code # https://github.com/actions/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install node # https://github.com/actions/setup-node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install Dependencies
        run: npm ci --ignore-scripts --allow-git=none --allow-remote=none

      - name: Build project
        run: npm run build

      - name: Publish package
        run: npm publish --provenance --access public
