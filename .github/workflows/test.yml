name: Test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Node LTS https://nodejs.org/en/about/releases/
        node-version: [20.X, 22.X, 24.X]
    steps:
      - name: Checkout code # https://github.com/actions/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install node # https://github.com/actions/setup-node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: ${{matrix.node-version}}

      - run: npm ci --ignore-scripts --allow-git=none --allow-remote=none
      - run: npm test
